# Bhuvan Makes — personal site for GitHub Pages
# Live URL once published: https://bhuvanmakes.github.io
# Repo name (create later on the bhuvanmakes account): bhuvanmakes.github.io
#
# GitHub profile (header/footer): https://github.com/bhuvanmakes only.
# Project repositories are not public on bhuvanmakes yet. Leave each
# project's `github` kit field empty until the repo is published there.
# Do not link github.com/bhuvanbagwe — those repositories are private
# and the URLs now 404.
#
# Do not add LinkedIn. Do not feature OpenExG-C5, AirCalibre or GoodOne.
# Do not put an email address or mailto: link anywhere on the site.
# Public name only: Bhuvan Makes. No location line until it is confirmed.

title: Bhuvan Makes
description: >-
  Hi, I'm Bhuvan. I consider myself a maker, and I enjoy tinkering
  with the stuff around me.
url: https://bhuvanmakes.github.io
image: /assets/img/bhuvan-makes-logo.png
baseurl: ""
lang: en
timezone: Asia/Kolkata

author:
  name: Bhuvan Makes

# Bhuvan's About text (lightly tightened, his voice).
about: |-
  Hi, I'm Bhuvan. I consider myself a maker, and I enjoy tinkering with the stuff around me. I love reading, especially science fiction, because I like to imagine my world as full of interesting things, never boring. I made this site to collect everything I'm working on, so when we meet, offline or online, we already have context :)

  Most of my projects are collaborations with talented people I've been lucky to meet, and they're credited on each project. Things I've worked on include algae as a food source, hydroponics, sensors for air quality monitoring, biomedical devices, plastic recycling, 3D printing, and a sci-fi novella of my own, free to read right here. If you have a project in mind we could work on together, let's just do it.

# Placeholder until Bhuvan adds a Google Form (or other) URL.
# Used by the "Wanna collaborate? :)" button and the footer Collaborate link.
collab_url: "#collaborate-form-todo"

# Optional footer links — leave empty (or comment out) to hide them.
instagram_url:
donate_url:

# Footer link hub (no LinkedIn, no Hackster, no email).
# Instagram and Patreon/Donate are appended only when the URLs above are set.
# Visible text is the platform name only — no usernames or URLs.
links:
  - label: GitHub
    url: https://github.com/bhuvanmakes
  - label: Instructables
    url: https://www.instructables.com/member/bhuvanmakes/
  - label: Hackaday
    url: https://hackaday.io/bhuvanmakes
  - label: YouTube
    url: https://www.youtube.com/@Bhuvanmakes
  - label: X
    url: https://x.com/Maker_Bhuvan

permalink: /blog/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

exclude:
  - README.md
  - EDITING.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .gitignore
  - _unpublished
  - _templates

sass:
  style: compressed
