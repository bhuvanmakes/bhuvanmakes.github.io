<footer class="site-footer">
  <div class="wrap">
    <ul class="footer-links">
      {% for item in site.links %}
        <li><a href="{{ item.url }}">{{ item.label }}</a></li>
      {% endfor %}
    </ul>
    <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    <p>© {{ 'now' | date: '%Y' }} Bhuvan Makes</p>
  </div>
</footer>
