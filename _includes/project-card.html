{%- assign project = include.project -%}
<li class="project-row{% if project.hero %} has-thumb{% endif %}">
  {%- if project.hero %}
  <a href="{{ project.url | relative_url }}">
    <img class="thumb" src="{{ project.hero | relative_url }}" alt="{{ project.hero_alt | default: project.title }}" width="56" height="56">
  </a>
  {%- endif %}
  <div class="project-row-text">
    {%- if project.status %}
    <p class="badge">{{ project.status }}</p>
    {%- endif %}
    <h3><a class="card-title" href="{{ project.url | relative_url }}">{{ project.title }}</a></h3>
    <p>{{ project.summary }}</p>
  </div>
</li>
