---
layout: default
---
<div class="wrap">
  <article class="post">
    <p class="kicker"><a href="{{ '/blog/' | relative_url }}">Blog</a></p>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%-d %B %Y' }}</time>
    </p>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
    {% if page.hero %}
    <figure class="hero-figure">
      <img src="{{ page.hero | relative_url }}" alt="{{ page.hero_alt | default: page.title }}">
      {% if page.hero_credit %}<figcaption>{{ page.hero_credit }}</figcaption>{% endif %}
    </figure>
    {% endif %}
    <div class="prose">
      {{ content }}
    </div>
    {% include kit.html item=page %}
  </article>
</div>
