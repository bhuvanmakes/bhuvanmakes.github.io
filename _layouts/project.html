---
layout: default
---
<div class="wrap">
  <article class="project">
    <p class="kicker"><a href="{{ '/projects/' | relative_url }}">Projects</a></p>
    {% if page.status %}<p class="badge">{{ page.status }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
    {% if page.hero %}
    <figure class="hero-figure">
      <img src="{{ page.hero | relative_url }}" alt="{{ page.hero_alt | default: page.title }}">
      {% if page.hero_credit %}<figcaption>{{ page.hero_credit }}</figcaption>{% endif %}
    </figure>
    {% endif %}
    <div class="prose">
      {{ content }}
    </div>
    {% include kit.html item=page %}
  </article>
</div>
